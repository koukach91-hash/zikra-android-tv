name: Build Zikra APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o Zikra_AndroidTV_APK_Project.zip -d extracted
          echo "ZIP contents:"
          find extracted -maxdepth 4 -type f | head -n 100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found in the ZIP."
            echo "Checking extracted files:"
            find extracted -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle project at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zikra-tv-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
